[project]
name = "ai-retail-os"
version = "0.1.0"
description = "AI Retail OS prototype — orchestrator + specialist agents over a queryable spine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "openai>=1.55",
    "google-genai>=0.3",
]

[project.optional-dependencies]
# Track 4 — MLflow tracing + eval pipe. Heavy dep (200MB+ once boto3
# pulls in); kept optional so the cockpit demo path works without
# pulling MLflow when an operator hasn't spun up the tracking stack.
# Activate with `pip install -e .[mlflow]` when MLFLOW_TRACE_ENABLED=1.
mlflow = [
    "mlflow>=2.16",
    "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
